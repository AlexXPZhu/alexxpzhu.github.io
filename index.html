<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xingpeng Zhu 的个人主页与项目。">
  <title>Xingpeng Zhu · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182941;
      --muted: #485a70;
      --accent: #2856ad;
      --paper: #f8fafe;
      --line: #d6e0ee;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.7;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    a { color: var(--accent); text-underline-offset: 0.25em; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .wrap { width: min(65rem, calc(100% - 3rem)); margin-inline: auto; }

    .site-header { border-bottom: 1px solid var(--line); }

    .bar, .nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
    }

    .bar { justify-content: space-between; padding-block: 1rem; }

    .bar a { color: inherit; text-decoration: none; }

    .bar a:hover { text-decoration: underline; }

    .site-name { font-weight: 700; }

    .hero {
      padding: clamp(2.25rem, 7vw, 5rem) clamp(1.5rem, 6vw, 4rem);
      margin-top: clamp(1.5rem, 5vw, 3rem);
      background: linear-gradient(125deg, #e1edff, #ecf4ff 65%, #f0f7f9);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
    }

    h1, h2, h3, p { margin: 0; }

    h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.2; }

    h2 { font-size: 1.5rem; line-height: 1.35; }

    h3 { font-size: 1.125rem; line-height: 1.4; }

    p { color: var(--muted); overflow-wrap: anywhere; }

    .hero p { max-width: 32em; margin-top: 0.85rem; font-size: 1.125rem; }

    .sections {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: clamp(1.5rem, 4vw, 3rem);
      margin-block: 2.5rem 3.5rem;
    }

    .sections h2 { margin-bottom: 0.85rem; }

    .project {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0.875rem;
      padding: 1.25rem;
    }

    .project p { margin-top: 0.375rem; }

    .site-footer {
      border-top: 1px solid var(--line);
      padding-block: 1rem 1.75rem;
    }

    @media (max-width: 40rem) {
      .wrap { width: calc(100% - 2rem); }
      .sections { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body id="top">
  <header class="site-header">
    <div class="wrap bar">
      <a class="site-name" href="#top">Xingpeng Zhu</a>
      <nav class="nav" aria-label="主导航">
        <a href="#about">关于我</a>
        <a href="#projects">项目</a>
        <a href="#github">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" id="about" aria-labelledby="intro-heading">
      <h1 id="intro-heading">你好，我是 Xingpeng Zhu。</h1>
      <p>欢迎来到我的个人主页。</p>
    </section>

    <div class="sections">
      <section id="projects" aria-labelledby="projects-heading">
        <h2 id="projects-heading">我的项目</h2>
        <article class="project">
          <h3>个人主页</h3>
          <p>用 HTML 和 CSS 搭建，托管在 GitHub Pages。</p>
          <p><a href="https://github.com/AlexXPZhu/alexxpzhu.github.io">查看主页源码</a></p>
        </article>
      </section>

      <section id="github" aria-labelledby="github-heading">
        <h2 id="github-heading">GitHub</h2>
        <p><a href="https://github.com/AlexXPZhu">@AlexXPZhu</a></p>
      </section>
    </div>
  </main>

  <footer class="wrap site-footer">
    <a href="#top">回到顶部</a>
  </footer>
</body>
</html>
